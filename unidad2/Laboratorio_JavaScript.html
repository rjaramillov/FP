<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio JavaScript · Fundamentos de Programación</title>
<meta name="description" content="Laboratorio interactivo: de Python a JavaScript (con capa TypeScript), con ejecución paso a paso, ejercicios con revisión automática, reto final con rúbrica y reflexión metacognitiva.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --grafito:#12141C; --papel:#FAFAF9; --indigo:#3B5BFB; --verde:#0E9E8F; --ambar:#E8992A; --pizarra:#67707F;
  --rojo:#D2453F; --linea:#E3E3DE; --blanco:#FFFFFF; --indigo-suave:#EEF1FF; --verde-suave:#E6F6F4; --ambar-suave:#FDF3E3; --rojo-suave:#FCEDEC;
  --code-bg:#161925; --code-fg:#E9E9E4;
  --f-titulo:"Space Grotesk",system-ui,sans-serif; --f-texto:"IBM Plex Sans",system-ui,sans-serif; --f-code:"JetBrains Mono",ui-monospace,monospace;
  --radio:12px;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--papel);color:var(--grafito);font-family:var(--f-texto);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--f-titulo);line-height:1.2;margin:0 0 .5em}
code{font-family:var(--f-code);font-size:.88em;background:var(--indigo-suave);color:#2a3fb8;padding:.08em .35em;border-radius:5px}
a{color:var(--indigo)}
button{font-family:var(--f-texto);font-size:1rem;cursor:pointer}
.hidden{display:none!important}
/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{background:var(--grafito);color:#D9DBE1;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px 30px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.brand-logo{width:42px;height:42px;border-radius:10px;background:var(--ambar);color:var(--grafito);display:grid;place-items:center;font-family:var(--f-code);font-weight:700;font-size:1.05rem;flex:none}
.brand b{display:block;font-family:var(--f-titulo);color:#fff;font-size:1.02rem;line-height:1.2}
.brand span{font-size:.78rem;color:#9AA1AE}
.prog{background:#232736;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:.82rem}
.prog-bar{height:8px;background:#363B4D;border-radius:9px;overflow:hidden;margin-top:6px}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),#3fd0bf);width:0;transition:width .4s}
.nav-grupo{font-family:var(--f-titulo);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ambar);margin:16px 6px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D9DBE1;padding:8px 10px;border-radius:8px;font-size:.9rem;line-height:1.3}
.nav-btn:hover{background:#232736}
.nav-btn.activo{background:var(--indigo);color:#fff}
.nav-btn .dot{width:20px;height:20px;border-radius:50%;border:2px solid #4A5063;flex:none;display:grid;place-items:center;font-size:.7rem;color:#fff}
.nav-btn .dot.visto{border-color:var(--ambar)}
.nav-btn .dot.ok{background:var(--verde);border-color:var(--verde)}
.nav-btn .dot.lock{border-style:dashed}
.main{min-width:0}
.topbar{display:none}
.contenido{max-width:1180px;margin:0 auto;padding:34px 34px 80px}
/* ---------- encabezado de vista ---------- */
.eyebrow{font-family:var(--f-code);font-size:.8rem;color:var(--pizarra);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.vista-titulo{font-size:2.1rem;margin-bottom:8px}
.objetivo{background:var(--blanco);border:1px solid var(--linea);border-left:5px solid var(--ambar);border-radius:10px;padding:12px 16px;margin:14px 0 26px;font-size:.98rem}
.objetivo b{font-family:var(--f-titulo)}
.seccion{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:24px 26px;margin-bottom:22px}
.seccion > h3{display:flex;align-items:center;gap:12px;font-size:1.3rem;margin-bottom:14px}
.num{width:32px;height:32px;border-radius:9px;background:var(--grafito);color:#fff;display:grid;place-items:center;font-size:.95rem;flex:none}
.seccion.trampa{border-color:#F1D3A3;background:#FFFCF6}
.seccion.trampa .num{background:var(--ambar);color:var(--grafito)}
.seccion.ts{border-color:#CBD3FF}
.seccion.ts .num{background:var(--indigo)}
.seccion.reto .num,.seccion.ejer .num{background:var(--verde)}
.nota{background:var(--indigo-suave);border-radius:8px;padding:10px 14px;font-size:.93rem}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
/* ---------- comparativa ---------- */
.compara{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lang-tag{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-titulo);font-weight:600;font-size:.86rem;margin-bottom:6px}
.lang-tag i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tabla{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:16px}
.tabla th{font-family:var(--f-titulo);text-align:left;background:var(--grafito);color:#fff;padding:9px 12px;font-weight:600}
.tabla th:first-child{border-radius:8px 0 0 0}.tabla th:last-child{border-radius:0 8px 0 0}
.tabla td{padding:8px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
.tabla td code{white-space:pre-wrap}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.88rem;line-height:1.6;padding:14px 16px;border-radius:10px;overflow-x:auto;white-space:pre}
pre.salida,pre.mini{background:#F2F2EE;border:1px dashed #CFCFC8;border-radius:8px;padding:10px 14px;font-family:var(--f-code);font-size:.9rem;margin:8px 0;white-space:pre-wrap}
/* tokens de color */
.cm-s-lab .cm-keyword,pre.code .cm-keyword{color:#9DB0FF;font-weight:500}
.cm-s-lab .cm-string,pre.code .cm-string,.cm-s-lab .cm-string-2,pre.code .cm-string-2{color:#5FD3C5}
.cm-s-lab .cm-number,pre.code .cm-number{color:#F5BE6B}
.cm-s-lab .cm-comment,pre.code .cm-comment{color:#8D96A8;font-style:italic}
.cm-s-lab .cm-atom,pre.code .cm-atom{color:#F59C8B}
.cm-s-lab .cm-def,pre.code .cm-def{color:#FFFFFF;font-weight:500}
.cm-s-lab .cm-property,pre.code .cm-property{color:#C9D3E6}
.cm-s-lab .cm-builtin,pre.code .cm-builtin,.cm-s-lab .cm-type,pre.code .cm-type,pre.code .cm-variable-3,.cm-s-lab .cm-variable-3{color:#E6A5F2}
.cm-s-lab .cm-operator,pre.code .cm-operator{color:#E9E9E4}
/* ---------- laboratorio ---------- */
.lab{border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;background:var(--blanco);margin-top:14px}
.lab-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,.75fr)}
.lab-editor{background:var(--code-bg);min-height:220px;position:relative}
.lab-editor .CodeMirror{height:auto;min-height:220px;background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:15px;line-height:1.65}
.lab-editor .CodeMirror-scroll{min-height:220px;max-height:560px}
.lab-editor .CodeMirror-gutters{background:#11131C;border-right:1px solid #262A38}
.lab-editor .CodeMirror-linenumber{color:#5B6274}
.lab-editor .CodeMirror-cursor{border-left:2px solid var(--ambar)}
.lab-editor .CodeMirror-selected{background:#2E3550!important}
.lab-editor .CodeMirror-matchingbracket{color:#fff!important;background:#3B5BFB55}
.lab-editor textarea.fallback{width:100%;min-height:260px;background:var(--code-bg);color:var(--code-fg);border:0;font-family:var(--f-code);font-size:15px;padding:12px;resize:vertical}
.ln-step{background:rgba(59,91,251,.32)!important;box-shadow:inset 4px 0 0 var(--ambar)}
.ln-true{background:rgba(14,158,143,.32)!important;box-shadow:inset 4px 0 0 #3fd0bf}
.ln-false{background:rgba(210,69,63,.30)!important;box-shadow:inset 4px 0 0 #ff7a72}
.ln-err{background:rgba(210,69,63,.40)!important;box-shadow:inset 4px 0 0 var(--rojo)}
.lab-side{padding:14px;border-left:1px solid var(--linea);display:flex;flex-direction:column;gap:10px;background:#FCFCFB}
.lab-side label{font-size:.8rem;font-weight:600;color:var(--pizarra)}
.lab-inputs{width:100%;min-height:92px;font-family:var(--f-code);font-size:.92rem;border:1px solid var(--linea);border-radius:8px;padding:8px;resize:vertical;background:#fff}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn-run{background:var(--indigo);color:#fff}
.btn-step{background:var(--grafito);color:#fff}
.btn-check{background:var(--verde);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--linea);color:var(--grafito)}
.btn-ambar{background:var(--ambar);color:var(--grafito)}
.btn.bloqueado{background:#D7D9DE;color:#5f6572;cursor:not-allowed}
.lab-btns{display:flex;flex-direction:column;gap:8px}
.lab-msg:empty{display:none}
.lab-msg{padding:12px 16px;border-top:1px solid var(--linea);font-size:.93rem}
.msg-err{background:var(--rojo-suave);color:#7d211c}
.msg-err b{color:var(--rojo)}
.msg-warn{background:var(--ambar-suave);color:#6b4510}
.msg-ok{background:var(--verde-suave);color:#0a5b53}
.msg-err ul,.msg-warn ul{margin:.3em 0 0}
.lab-trace{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#F3F4F8;border-top:1px solid var(--linea)}
.lab-trace .tbtn{width:40px;height:36px;border-radius:8px;border:1px solid #CDD1DC;background:#fff;font-size:1rem}
.lab-trace input[type=range]{flex:1;min-width:120px;accent-color:var(--indigo)}
.lab-trace .cuenta{font-family:var(--f-code);font-size:.85rem;color:var(--pizarra);min-width:110px;text-align:right}
.step-desc{flex-basis:100%;font-size:.95rem;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid #DDE1EB;min-height:40px}
.step-desc .k{font-family:var(--f-code);font-size:.78rem;padding:2px 7px;border-radius:5px;background:var(--grafito);color:#fff;margin-right:8px}
.step-desc .k.t{background:var(--verde)}.step-desc .k.f{background:var(--rojo)}.step-desc .k.e{background:var(--rojo)}.step-desc .k.fin{background:var(--indigo)}
.lab-panels{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--linea)}
.panel{padding:12px 14px;min-height:130px;min-width:0}
.panel + .panel{border-left:1px solid var(--linea)}
.panel h5{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--pizarra);margin-bottom:8px}
.console{font-family:var(--f-code);font-size:.88rem;background:var(--code-bg);color:#E9E9E4;border-radius:8px;padding:10px 12px;min-height:90px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .in{color:#F5BE6B}
.console .in em{color:#8D96A8;font-style:normal}
.console .vacio{color:#5B6274}
.frame{border:1px solid var(--linea);border-radius:9px;margin-bottom:8px;overflow:hidden}
.frame-h{font-family:var(--f-code);font-size:.78rem;background:#F1F2F5;padding:4px 10px;color:var(--pizarra);font-weight:600}
.frame.top .frame-h{background:var(--indigo);color:#fff}
.frame table{width:100%;border-collapse:collapse;font-size:.88rem}
.frame td{padding:5px 10px;border-top:1px solid #F0F0EC;vertical-align:top}
.frame td.n{font-family:var(--f-code);font-weight:600;width:1%;white-space:nowrap;color:#2a3fb8}
.frame tr.cambio td{background:#FFF4DC;animation:destello 1s}
@keyframes destello{from{background:#FFD98A}to{background:#FFF4DC}}
.frame .vacia{padding:6px 10px;color:var(--pizarra);font-size:.82rem}
.v{font-family:var(--f-code);font-size:.86rem}
.v-num{color:#B4630A}.v-str{color:#0A7D72}.v-bool{color:#2a3fb8;font-weight:600}.v-null,.v-undef{color:var(--pizarra);font-style:italic}.v-fn{color:#8a3fb8}
.v-tipo{font-size:.68rem;color:#9aa0ab;margin-left:6px;font-family:var(--f-texto)}
.arr{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid #C9CDD8;border-radius:6px;overflow:hidden;vertical-align:middle}
.arr .cel{display:flex;flex-direction:column;align-items:center;min-width:34px;border-right:1px solid #C9CDD8;padding:2px 6px}
.arr .cel:last-child{border-right:0}
.arr .cel small{font-size:.62rem;color:#9aa0ab;font-family:var(--f-code)}
.arr .cel.cambio{background:#FFE7AE}
.arr-vacio{font-family:var(--f-code);color:var(--pizarra)}
.cadena{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.nodo{display:inline-flex;border:1.5px solid var(--verde);border-radius:6px;overflow:hidden;font-family:var(--f-code);font-size:.82rem}
.nodo b{padding:2px 8px;background:var(--verde-suave)}
.nodo i{padding:2px 5px;color:var(--verde);font-style:normal;border-left:1px solid var(--verde)}
.flecha{color:var(--verde);font-weight:700}
.obj{font-family:var(--f-code);font-size:.84rem}
/* ---------- ejercicios y resultados ---------- */
.res-tabla{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px}
.res-tabla th{background:#F1F2F5;text-align:left;padding:7px 10px;font-family:var(--f-titulo)}
.res-tabla td{padding:7px 10px;border-top:1px solid var(--linea);vertical-align:top;font-family:var(--f-code);font-size:.82rem;white-space:pre-wrap}
.res-tabla tr.ok td:last-child{color:var(--verde);font-weight:700}
.res-tabla tr.mal td:last-child{color:var(--rojo);font-weight:700}
.dif{background:#FFE1DE;border-radius:3px}
.reqs{list-style:none;padding:0;margin:10px 0 0}
.reqs li::before{content:attr(data-s);display:inline-block;width:1.5em;font-weight:700}
.reqs li.ok{color:var(--verde)}.reqs li.mal{color:var(--rojo)}
.banner{border-radius:10px;padding:14px 16px;margin-top:14px;font-size:.98rem}
.banner.ok{background:var(--verde-suave);border:1px solid #9BD8CF;color:#0a5b53}
.banner.mal{background:var(--rojo-suave);border:1px solid #F0BBB7;color:#7d211c}
.pista{background:var(--ambar-suave);border:1px solid #F1D3A3;border-radius:10px;padding:12px 16px;margin-top:12px}
.estado-ej{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:20px;background:#F1F2F5;color:var(--pizarra);margin-left:auto}
.estado-ej.ok{background:var(--verde-suave);color:var(--verde)}
/* ---------- TS completa ---------- */
.completa{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.92rem;line-height:2;padding:14px 16px;border-radius:10px;white-space:pre-wrap;margin:10px 0}
.completa select{font-family:var(--f-code);font-size:.88rem;background:#232736;color:#F5BE6B;border:1px dashed #6b7390;border-radius:6px;padding:2px 4px}
.completa select.ok{border:1.5px solid #3fd0bf;color:#5FD3C5}
.completa select.mal{border:1.5px solid #ff7a72;color:#ff9a93}
.ts-err{background:#2a1517;color:#FFB4AE;border-left:4px solid var(--rojo);padding:10px 14px;border-radius:8px;font-family:var(--f-code);font-size:.85rem;white-space:pre-wrap;margin-top:8px}
details.tsd summary{cursor:pointer;font-weight:600;color:var(--indigo);margin-top:12px}
/* ---------- formularios ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.campo label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
.campo input,.campo textarea,.campo select{width:100%;font-family:var(--f-texto);font-size:1rem;padding:10px 12px;border:1px solid #CFD2D8;border-radius:9px;background:#fff}
.campo textarea{min-height:96px;resize:vertical}
.campo input:focus,.campo textarea:focus{outline:2px solid var(--indigo);border-color:transparent}
.cuenta-car{font-size:.75rem;color:var(--pizarra);text-align:right}
.pregunta{border-top:1px solid var(--linea);padding:16px 0}
.pregunta:first-of-type{border-top:0}
.pregunta > p{font-weight:600;margin:0 0 10px}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opciones label{display:inline-flex;align-items:center;gap:8px;border:1px solid #CFD2D8;border-radius:30px;padding:7px 14px;background:#fff;cursor:pointer;font-size:.93rem}
.opciones label:has(input:checked){background:var(--indigo);color:#fff;border-color:var(--indigo)}
.opciones input{accent-color:var(--indigo)}
.matriz{width:100%;border-collapse:collapse;font-size:.93rem}
.matriz th{font-family:var(--f-titulo);font-size:.85rem;padding:8px;background:#F1F2F5}
.matriz td{padding:8px;border-top:1px solid var(--linea);text-align:center}
.matriz td:first-child{text-align:left}
.matriz input{width:20px;height:20px;accent-color:var(--indigo)}
.escala{display:flex;gap:6px}
.escala label{width:46px;height:42px;display:grid;place-items:center;border:1px solid #CFD2D8;border-radius:9px;cursor:pointer;font-weight:600;background:#fff}
.escala label:has(input:checked){background:var(--indigo);color:#fff;border-color:var(--indigo)}
.escala input{position:absolute;opacity:0;pointer-events:none}
.escala-leyenda{display:flex;justify-content:space-between;font-size:.78rem;color:var(--pizarra);max-width:270px}
/* ---------- inicio ---------- */
.hero{background:var(--grafito);color:#fff;border-radius:16px;padding:34px 36px;margin-bottom:24px;position:relative;overflow:hidden}
.hero h1{font-size:2.3rem;margin-bottom:10px}
.hero p{color:#C9CDD8;max-width:720px;font-size:1.05rem}
.hero .deco{position:absolute;right:28px;top:20px;font-family:var(--f-code);font-size:.9rem;color:#5B6274;line-height:1.7;white-space:pre}
.hero .deco b{color:var(--ambar)}
.ciclo{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.ciclo div{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:10px;text-align:center;font-size:.85rem}
.ciclo b{display:block;font-family:var(--f-titulo);font-size:.95rem}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mapa button{text-align:left;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.mapa button:hover{border-color:var(--indigo)}
.mapa small{display:block;color:var(--pizarra);font-size:.75rem}
/* ---------- rúbrica ---------- */
.rubrica{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:10px}
.rubrica th{background:var(--grafito);color:#fff;padding:8px;font-family:var(--f-titulo);font-weight:600;text-align:left}
.rubrica td{border:1px solid var(--linea);padding:8px;vertical-align:top}
.rubrica td.crit{font-weight:600;background:#FAFAF8;width:18%}
.rubrica td.sel{background:var(--indigo-suave);outline:2px solid var(--indigo);outline-offset:-2px}
.rubrica td.sel::before{content:"● Sugerido  ";color:var(--indigo);font-weight:700;font-size:.75rem;display:block}
.calif{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.calif .big{font-family:var(--f-titulo);font-size:2.4rem;font-weight:700;color:var(--indigo)}

<script>
/* ============================================================
   Motor del Laboratorio JS — instrumentación + runtime de rastreo
   ============================================================ */
(function (root) {
  "use strict";
  var acornLib = root.acorn || (typeof require === "function" ? require("acorn") : null);

  /* ---------- utilidades de AST ---------- */
  function isNode(x) { return x && typeof x === "object" && typeof x.type === "string"; }
  function isFn(n) { return n && (n.type === "FunctionDeclaration" || n.type === "FunctionExpression" || n.type === "ArrowFunctionExpression"); }

  function patternNames(p, out) {
    if (!p) return out;
    switch (p.type) {
      case "Identifier": out.push(p.name); break;
      case "ObjectPattern": p.properties.forEach(function (pr) { patternNames(pr.type === "RestElement" ? pr.argument : pr.value, out); }); break;
      case "ArrayPattern": p.elements.forEach(function (e) { patternNames(e, out); }); break;
      case "RestElement": patternNames(p.argument, out); break;
      case "AssignmentPattern": patternNames(p.left, out); break;
    }
    return out;
  }
  // nombres declarados con var (sin entrar a funciones anidadas)
  function varNames(node, out) {
    if (!isNode(node)) return out;
    if (node.type === "VariableDeclaration" && node.kind === "var") {
      node.declarations.forEach(function (d) { patternNames(d.id, out); });
    }
    for (var k in node) {
      if (k === "loc" || k === "start" || k === "end") continue;
      var v = node[k];
      if (Array.isArray(v)) v.forEach(function (c) { if (isNode(c) && !isFn(c)) varNames(c, out); });
      else if (isNode(v) && !isFn(v)) varNames(v, out);
    }
    return out;
  }
  // let/const/class/function declarados directamente en una lista de sentencias
  function lexicalNames(stmts, out) {
    stmts.forEach(function (s) {
      if (s.type === "VariableDeclaration" && s.kind !== "var") s.declarations.forEach(function (d) { patternNames(d.id, out); });
      else if ((s.type === "FunctionDeclaration" || s.type === "ClassDeclaration") && s.id) out.push(s.id.name);
    });
    return out;
  }

  function Scope(parent, isFunc, names, fname) {
    this.parent = parent; this.isFunc = isFunc; this.fname = fname || null;
    this.names = [];
    var self = this;
    (names || []).forEach(function (n) { if (self.names.indexOf(n) < 0 && n.indexOf("__") !== 0) self.names.push(n); });
  }
  Scope.prototype.visible = function () {
    // nombres desde el ámbito de función más cercano hasta este bloque
    var chain = [], s = this;
    while (s) { chain.unshift(s); if (s.isFunc) break; s = s.parent; }
    var out = [];
    chain.forEach(function (sc) { sc.names.forEach(function (n) { if (out.indexOf(n) < 0) out.push(n); }); });
    return out;
  };
  Scope.prototype.getter = function () {
    var names = this.visible();
    return "()=>({" + names.map(function (n) { return JSON.stringify(n) + ":__v(()=>" + n + ")"; }).join(",") + "})";
  };

  /* ---------- descripción en español de cada sentencia ---------- */
  function describe(stmt, src) {
    var t = function (n) { return src.slice(n.start, n.end); };
    switch (stmt.type) {
      case "VariableDeclaration": {
        var names = [];
        stmt.declarations.forEach(function (d) { patternNames(d.id, names); });
        var txt = t(stmt);
        var lee = /\bleer\s*\(/.test(txt) ? " y se le asigna un dato leído" : "";
        if (stmt.kind === "const") return (names.length > 1 ? "Se crean las constantes «" : "Se crea la constante «") + names.join("», «") + "»" + lee;
        return (names.length > 1 ? "Se crean las variables «" : "Se crea la variable «") + names.join("», «") + "»" + lee;
      }
      case "ExpressionStatement": {
        var e = stmt.expression;
        if (e.type === "AssignmentExpression") {
          var L = t(e.left);
          if (e.operator === "=") return "Se asigna un nuevo valor a «" + L + "»";
          return "Se actualiza «" + L + "» con " + e.operator;
        }
        if (e.type === "UpdateExpression") return (e.operator === "++" ? "Se incrementa «" : "Se decrementa «") + t(e.argument) + "» en 1";
        if (e.type === "CallExpression") {
          var c = t(e.callee);
          if (/^console\.(log|info|warn|error)$/.test(c)) return "Se muestra un resultado en la consola";
          if (/\.push$/.test(c)) return "Se agrega un elemento al final del arreglo con push()";
          if (/\.pop$/.test(c)) return "Se quita el último elemento del arreglo con pop()";
          if (/\.sort$/.test(c)) return "Se ordena el arreglo con sort()";
          return "Se llama a " + c + "()";
        }
        return "Se evalúa una expresión";
      }
      case "IfStatement": return "Se evalúa una decisión (if)";
      case "WhileStatement": return "Inicia un ciclo while";
      case "DoWhileStatement": return "Inicia un ciclo do...while (se ejecuta al menos una vez)";
      case "ForStatement": return "Inicia un ciclo for";
      case "ForOfStatement": return "Inicia un ciclo for...of (recorre los valores)";
      case "ForInStatement": return "Inicia un ciclo for...in (recorre los índices o claves)";
      case "ReturnStatement": return "Se devuelve un valor con return";
      case "BreakStatement": return "break: se sale inmediatamente del ciclo";
      case "ContinueStatement": return "continue: se salta a la siguiente vuelta del ciclo";
      case "FunctionDeclaration": return "Se define la función «" + (stmt.id ? stmt.id.name : "") + "»";
      case "SwitchStatement": return "Se evalúa un switch";
      case "ThrowStatement": return "Se lanza un error con throw";
      case "TryStatement": return "Inicia un bloque try";
      case "BlockStatement": return "Inicia un bloque { }";

  /* ---------- traducción de errores ---------- */
  var PY_HINTS = {
    print: "En JavaScript se usa console.log(...) en lugar de print(...).",
    input: "En este laboratorio se usa leer(...) en lugar de input(...).",
    len: "En JavaScript la longitud es una propiedad: arreglo.length (sin paréntesis).",
    True: "En JavaScript los booleanos van en minúscula: true.",
    False: "En JavaScript los booleanos van en minúscula: false.",
    None: "En JavaScript el valor «vacío» es null.",
    int: "Para convertir a número usa Number(...) o parseInt(...).",
    float: "Para convertir a número decimal usa Number(...) o parseFloat(...).",
    str: "Para convertir a texto usa String(...).",
    range: "JavaScript no tiene range(); usa un for clásico: for (let i = 0; i < n; i++).",
    elif: "En JavaScript se escribe else if (...) { }.",
    and: "En JavaScript «y» se escribe &&.",
    or: "En JavaScript «o» se escribe ||.",
    not: "En JavaScript la negación se escribe !.",
    append: "Para agregar a un arreglo usa arreglo.push(valor).",
    def: "Las funciones en JavaScript se declaran con function nombre(...) { }."
  };

  function pythonisms(src) {
    var hints = [];
    var lines = src.split("\n");
    lines.forEach(function (ln, i) {
      var s = ln.replace(/\/\/.*$/, "");
      if (/^\s*(if|elif|while|for|else|def)\b[^{]*:\s*$/.test(s)) hints.push("Línea " + (i + 1) + ": parece sintaxis de Python (termina en «:»). En JavaScript los bloques se abren con { y se cierran con }.");
      else if (/^\s*elif\b/.test(s)) hints.push("Línea " + (i + 1) + ": en JavaScript se escribe else if (...) { }.");
      else if (/\bprint\s*\(/.test(s)) hints.push("Línea " + (i + 1) + ": en JavaScript se usa console.log(...) en lugar de print(...).");
      else if (/\b(True|False|None)\b/.test(s)) hints.push("Línea " + (i + 1) + ": en JavaScript se escribe true, false o null (en minúscula).");
      else if (/\s(and|or)\s/.test(s) && !/["'`]/.test(s)) hints.push("Línea " + (i + 1) + ": en JavaScript «and» es && y «or» es ||.");
      else if (/^\s*#/.test(s)) hints.push("Línea " + (i + 1) + ": en JavaScript los comentarios se escriben con // en lugar de #.");
    });
    return hints.slice(0, 3);
  }

  function translateSyntax(e, src) {
    var m = e.message.replace(/\s*\(\d+:\d+\)$/, "");

    var msg;

    if (/Unterminated string/.test(m)) msg = "Un texto (string) no se cerró: falta la comilla de cierre.";

    else if (/Unexpected character/.test(m)) msg = "Hay un carácter que JavaScript no reconoce (¿comillas tipográficas “ ” o algún símbolo copiado?).";

    }
    else if (/Assigning to rvalue|Invalid left-hand side/.test(m)) msg = "No se puede asignar a eso. ¿Usaste = (asignar) donde querías === (comparar)?";
    else if (/'return' outside of function/.test(m)) msg = "return solo puede usarse dentro de una función.";
    else if (/Unexpected keyword 'const'|Unexpected keyword 'let'/.test(m)) msg = "Hay una declaración let/const en un lugar no permitido (¿falta una llave { del bloque?).";

  function translateRuntime(err, src) {

  /* ---------- instrumentación ---------- */
  function instrument(src) {
    var comments = 0, ast;

    }
    var ins = [], seq = 0;
    function open(pos, text) { ins.push({ pos: pos, text: text, k: 1, seq: seq++ }); }
    function close(pos, text) { ins.push({ pos: pos, text: text, k: 0, seq: seq++ }); }
    function line(n) { return n.loc.start.line; }

    function hook(stmt, scope) {
      return "__s(" + line(stmt) + "," + JSON.stringify(describe(stmt, src)) + "," + scope.getter() + ");";
    }
    function statements(list, scope) {
      list.forEach(function (st) {

    function body(st, scope) {

    function wrapTest(test, scope) {

      visit(test, scope);

    }
    function fnName(n, ctx) { return (n.id && n.id.name) || ctx || "anónima"; }
    function visitFunction(n, scope, ctx) {
      var params = [];
      n.params.forEach(function (p) { patternNames(p, params); });
      var names = params.concat(varNames(n.body, []));
      if (n.body.type === "BlockStatement") lexicalNames(n.body.body, names);
      var name = fnName(n, ctx);
      var fs = new Scope(scope, true, names, name);
      n.params.forEach(function (p) { visit(p, fs); });
      var enter = "__enter(" + JSON.stringify(name) + "," + line(n) + "," + fs.getter() + ");";

        open(n.body.start, "{" + enter + "try{return __ret(" + line(n.body) + "," + fs.getter() + ",(");

        close(n.body.end, "))}finally{__exit()}}");

    }
    function generic(n, scope) {

        if (k === "loc" || k === "start" || k === "end" || k === "type") continue;
        var v = n[k];
        if (Array.isArray(v)) v.forEach(function (c) { if (isNode(c)) visit(c, scope); });

    }
    function visit(n, scope, ctx) {
      if (!isNode(n)) return;

          var bs = new Scope(scope, false, lexicalNames(n.body, []));

        case "AssignmentExpression":

          return;
        case "Property": case "MethodDefinition":
          if (n.computed) visit(n.key, scope);
          visit(n.value, scope, n.key && (n.key.name || n.key.value));
          return;
        case "IfStatement":
          wrapTest(n.test, scope);
          body(n.consequent, scope);
          if (n.alternate) {
            if (n.alternate.type === "IfStatement") visit(n.alternate, scope);
            else body(n.alternate, scope);
          }
          return;
        case "WhileStatement":
          wrapTest(n.test, scope); body(n.body, scope); return;
        case "DoWhileStatement":
          body(n.body, scope); wrapTest(n.test, scope); return;
        case "ForStatement": {
          var fnames = [];
          if (n.init && n.init.type === "VariableDeclaration" && n.init.kind !== "var") n.init.declarations.forEach(function (d) { patternNames(d.id, fnames); });
          var fsc = new Scope(scope, false, fnames);
          if (n.init) visit(n.init, fsc);
          if (n.test) wrapTest(n.test, fsc);
          if (n.update) {
            open(n.update.start, "(");
            visit(n.update, fsc);
            close(n.update.end, "),__u(" + line(n.update) + "," + fsc.getter() + "," + JSON.stringify(text(n.update)) + ")");

          body(n.body, fsc);
          return;
        }
        case "ForOfStatement": case "ForInStatement": {
          var onames = [];
          if (n.left.type === "VariableDeclaration" && n.left.kind !== "var") n.left.declarations.forEach(function (d) { patternNames(d.id, onames); });

          visit(n.right, scope);
          body(n.body, osc);
          return;
        }
        case "ReturnStatement":
          if (n.argument) {
            open(n.argument.start, "__ret(" + line(n) + "," + scope.getter() + ",(");

            close(n.argument.end, "))");

          return;
        case "SwitchStatement": {
          visit(n.discriminant, scope);

          }
          if (n.finalizer) visit(n.finalizer, scope);
          return;
        case "LabeledStatement":
          visit(n.body, scope); return;

      }
    }

    var gnames = lexicalNames(ast.body, varNames(ast, []));
    var gscope = new Scope(null, true, gnames, "Global");
    statements(ast.body, gscope);

    ins.sort(function (a, b) {
      if (a.pos !== b.pos) return a.pos - b.pos;
      if (a.k !== b.k) return a.k - b.k;           // cierres antes que aperturas
      return a.k === 0 ? b.seq - a.seq : a.seq - b.seq;

    ins.forEach(function (i) { out += src.slice(last, i.pos) + i.text; last = i.pos; });
    out += src.slice(last);

  }

  /* ---------- advertencias de estilo (no bloquean) ---------- */
  function walk(n, fn) {
    if (!isNode(n)) return;
    fn(n);
    for (var k in n) {
      if (k === "loc") continue;
      var v = n[k];
      if (Array.isArray(v)) v.forEach(function (c) { walk(c, fn); });
      else if (isNode(v)) walk(v, fn);

  }
  function lint(ast, src) {
    var w = [];
    walk(ast, function (n) {
      if (n.type === "BinaryExpression" && (n.operator === "==" || n.operator === "!=")) {

      }
      if (n.type === "VariableDeclaration" && n.kind === "var") {
        w.push({ line: n.loc.start.line, msg: "Evita «var»; usa «let» (si el valor cambia) o «const» (si no cambia)." });
      }
      if (n.type === "CallExpression" && n.callee.type === "MemberExpression" && n.callee.property && n.callee.property.name === "sort" && n.arguments.length === 0) {
        w.push({ line: n.loc.start.line, msg: "sort() sin comparador ordena como TEXTO. Para números usa sort((a, b) => a - b)." });
      }
    });
    return w;
  }

  /* ---------- análisis para requisitos de ejercicios y rúbrica ---------- */
  function analyze(ast, comments) {
    var a = { types: {}, ops: {}, props: {}, calls: {}, assigned: {}, kinds: {}, ids: {}, decls: [], comments: comments || 0, loopDepth: 0 };
    function rec(n, depth) {
      if (!isNode(n)) return;
      a.types[n.type] = (a.types[n.type] || 0) + 1;
      var loop = /^(For|ForOf|ForIn|While|DoWhile)Statement$/.test(n.type);
      var d = loop ? depth + 1 : depth;
      if (d > a.loopDepth) a.loopDepth = d;
      if (n.type === "BinaryExpression" || n.type === "LogicalExpression") a.ops[n.operator] = true;
      if (n.type === "UnaryExpression") a.ops[n.operator + "u"] = true;
      if (n.type === "MemberExpression" && !n.computed && n.property) a.props[n.property.name] = true;
      if (n.type === "CallExpression") {
        if (n.callee.type === "Identifier") a.calls[n.callee.name] = true;
        if (n.callee.type === "MemberExpression" && n.callee.property) a.calls[(n.callee.object.name || "") + "." + n.callee.property.name] = true;
      }
      if (n.type === "AssignmentExpression" && n.left.type === "Identifier") a.assigned[n.left.name] = true;
      if (n.type === "AssignmentExpression" && n.left.type === "MemberExpression") a.assigned["[member]"] = true;
      if (n.type === "UpdateExpression" && n.argument.type === "Identifier") a.assigned[n.argument.name] = true;
      if (n.type === "VariableDeclaration") { a.kinds[n.kind] = true; n.declarations.forEach(function (dd) { patternNames(dd.id, a.decls); }); }
      if (n.type === "Identifier") a.ids[n.name] = true;
      for (var k in n) {
        if (k === "loc") continue;
        var v = n[k];
        if (Array.isArray(v)) v.forEach(function (c) { rec(c, d); });
        else if (isNode(v)) rec(v, d);
      }
    }
    rec(ast, 0);
    a.has = function (t) { return !!a.types[t]; };
    a.loop = function () { return a.has("ForStatement") || a.has("WhileStatement") || a.has("DoWhileStatement") || a.has("ForOfStatement") || a.has("ForInStatement"); };
    return a;
  }

  /* ---------- runtime (se ejecuta dentro de un Web Worker) ---------- */
  function labRuntime(code, inputs, opts) {
    var MAX_SNAP = opts.maxSnap == null ? 1500 : opts.maxSnap;
    var MAX_STEPS = opts.maxSteps || 20000, MAX_OUT = 800;
    var steps = [], outputs = [], count = 0, truncated = false, truncOut = false;
    var TDZ = { tdz: true };
    var ids = new WeakMap(), nextId = 1, inIdx = 0, lastLine = 0;
    var stack = [{ name: "Global", g: null }];
    function LimitError() { this.limit = true; }
    function InputError() { this.input = true; }

    function ser(v, d, seen) {
      if (v === null) return { t: "null" };
      var t = typeof v;
      if (t === "undefined") return { t: "undef" };
      if (t === "number") return { t: "num", v: Object.is(v, -0) ? "0" : String(v) };
      if (t === "string") return { t: "str", v: v.length > 300 ? v.slice(0, 300) + "…" : v };
      if (t === "boolean") return { t: "bool", v: String(v) };
      if (t === "function") return { t: "fn", v: v.name || "anónima" };
      if (t === "object") {
        var id = ids.get(v);
        if (!id) { id = nextId++; ids.set(v, id); }
        if (seen.indexOf(v) >= 0 || d > 14) return { t: "ref", id: id };
        seen.push(v);
        var r;
        if (Array.isArray(v)) r = { t: "arr", id: id, len: v.length, items: v.slice(0, 60).map(function (x) { return ser(x, d + 1, seen); }) };
        else r = { t: "obj", id: id, entries: Object.keys(v).slice(0, 30).map(function (k) { return [k, ser(v[k], d + 1, seen)]; }) };
        seen.pop();
        return r;
      }
      return { t: "other", v: String(v) };
    }
    function fmt(v, top, d, seen) {
      d = d || 0; seen = seen || [];
      if (v === null) return "null";
      var t = typeof v;
      if (t === "undefined") return "undefined";
      if (t === "string") return top ? v : JSON.stringify(v);
      if (t === "number") return Object.is(v, -0) ? "0" : String(v);
      if (t === "function") return "[Function: " + (v.name || "anónima") + "]";
      if (t === "object") {
        if (seen.indexOf(v) >= 0) return "[Circular]";
        if (d > 3) return Array.isArray(v) ? "[Array]" : "[Object]";
        seen.push(v);
        var s;
        if (Array.isArray(v)) s = "[" + v.map(function (x) { return fmt(x, false, d + 1, seen); }).join(", ") + "]";
        else {
          var ks = Object.keys(v);
          s = ks.length ? "{ " + ks.map(function (k) { return k + ": " + fmt(v[k], false, d + 1, seen); }).join(", ") + " }" : "{}";
        }

      }

    }

      return stack.map(function (fr) {
        var vars = [];
        if (fr.g) {
          var o = fr.g();

        }
        return { name: fr.name, vars: vars };
      });
    }
    function record(st, force) {
      count++;
      if (count > MAX_STEPS && !force) throw new LimitError();
      if (steps.length < MAX_SNAP || force) {
        st.frames = snap(); st.out = outputs.length; steps.push(st);
      } else truncated = true;
    }
    function top() { return stack[stack.length - 1]; }
    var api = {
      __v: function (f) { try { return f(); } catch (e) { return TDZ; } },
      __s: function (L, desc, g) { top().g = g; lastLine = L; record({ type: "line", line: L, desc: desc }); },
      __c: function (L, g, txt, val) { top().g = g; lastLine = L; record({ type: "cond", line: L, text: txt, value: !!val, raw: ser(val, 0, []) }); return val; },
      __u: function (L, g, txt) { top().g = g; lastLine = L; record({ type: "update", line: L, text: txt }); },
      __enter: function (name, L, g) {
        if (stack.length > 400) { var e = new RangeError("Maximum call stack size exceeded"); throw e; }
        stack.push({ name: name, g: g }); lastLine = L; record({ type: "call", line: L, name: name });
      },
      __exit: function () { if (stack.length > 1) stack.pop(); },
      __ret: function (L, g, val) { top().g = g; lastLine = L; record({ type: "return", line: L, name: top().name, value: ser(val, 0, []) }); return val; },
      leer: function (msg) {
        if (inIdx >= inputs.length) throw new InputError();
        var val = String(inputs[inIdx++]);
        outputs.push({ k: "in", msg: msg == null ? "" : String(msg), val: val });
        return val;
      }
    };
    var cons = {
      log: function () { if (outputs.length >= MAX_OUT) { truncOut = true; return; } outputs.push({ k: "out", text: Array.prototype.map.call(arguments, function (a) { return fmt(a, true); }).join(" ") }); }
    };
    cons.info = cons.warn = cons.error = cons.log;
    var result = { steps: steps, outputs: outputs, error: null, truncated: false };
    try {
      var fn = new Function("__v", "__s", "__c", "__u", "__enter", "__exit", "__ret", "leer", "console", "prompt", "alert", "\"use strict\";\n" + code);
      fn(api.__v, api.__s, api.__c, api.__u, api.__enter, api.__exit, api.__ret, api.leer, cons, api.leer, cons.log);
      stack.length = 1;
      record({ type: "end", line: 0 }, true);
    } catch (e) {
      stack.length = Math.max(1, stack.length);
      if (e && e.limit) result.error = { kind: "limit", line: lastLine };
      else if (e && e.input) result.error = { kind: "input", line: lastLine };
      else result.error = { kind: "runtime", name: (e && e.name) || "Error", msg: (e && e.message) || String(e), line: lastLine };
      try { record({ type: "error", line: lastLine }, true); } catch (e2) { }
    }

    result.count = count;
    return result;
  }

  var WORKER_SRC = labRuntime.toString() + "\nonmessage=function(e){var d=e.data;postMessage(labRuntime(d.code,d.inputs,d.opts||{}));};";

  var api = {
    instrument: instrument, analyze: analyze, labRuntime: labRuntime,
    translateRuntime: translateRuntime, pythonisms: pythonisms, WORKER_SRC: WORKER_SRC
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.LabEngine = api;
})(typeof window !== "undefined" ? window : globalThis);

  /* ---------- piezas visuales reutilizables ---------- */
  function pipe(items) {
    return "<div class='gv-pipe'>" + items.map(function (x, i) { return (i ? "<span class='gv-arr'>→</span>" : "") + "<span class='gv-box " + (x[1] || "") + "'>" + x[0] + "</span>"; }).join("") + "</div>";
  }
  function caja(nombre, valor, tipo) { return "<div class='gv-var'><div class='gv-var-n'>" + nombre + "</div><div class='gv-var-v'>" + valor + "</div>" + (tipo ? "<div class='gv-var-t'>" + tipo + "</div>" : "") + "</div>"; }
  function celdas(vals, marca) { return "<span class='arr gv-big'>" + vals.map(function (v, i) { return "<span class='cel" + (marca === i ? " cambio" : "") + "'><small>" + i + "</small><span class='v v-num'>" + v + "</span></span>"; }).join("") + "</span>"; }

  /* ---------------- verificación de ejercicios ---------------- */
  async function evaluar(code, tests, requisitos) {
    var ins = E.instrument(code);
    if (!ins.ok) return { syntax: ins.error, ok: false, results: [], reqs: [] };
    var a = E.analyze(ins.ast, ins.comments);
    var results = [];
    for (var i = 0; i < tests.length; i++) {
      var t = tests[i];
      var r = await runCode(ins.code, t.in, { maxSnap: 0 });
      var got = outLines(r);
      var ok = !r.error && got.length === t.out.length && got.every(function (l, j) { return l === t.out[j].trim(); });
      results.push({ t: t, got: got, err: r.error, ok: ok });
    }
    var reqs = (requisitos || []).map(function (q) { var ok = false; try { ok = !!q.fn(a); } catch (e) { } return { msg: q.msg, ok: ok }; });
    return { ok: results.every(function (r) { return r.ok; }) && reqs.every(function (r) { return r.ok; }), results: results, reqs: reqs, analysis: a, warnings: ins.warnings };
  }
  function resultadosHTML(ev) {

      if (r.err) gotHTML += "\n<span class='dif'>⚠ " + esc(r.err.kind === "runtime" ? E.translateRuntime(r.err).msg : r.err.kind === "input" ? "Pidió más datos de los que hay" : r.err.kind === "limit" ? "Ciclo infinito" : "Error") + "</span>";
      return "<tr class='" + (r.ok ? "ok" : "mal") + "'><td>" + (r.t.nombre ? esc(r.t.nombre) + "\n" : "") + (r.t.in.length ? r.t.in.map(function (x) { return x === "" ? "(vacío)" : esc(x); }).join(", ") : "—") + "</td><td>" + esc(exp.join("\n")) + "</td><td>" + gotHTML + "</td><td>" + (r.ok ? "✓" : "✗") + "</td></tr>";
    }).join("");

  /* ---------------- glosario, citas APA y modal ---------------- */
  var G = window.LAB_GLOSARIO, R = window.LAB_REFS;

  function apaHTML(k) { var r = R[k]; if (!r) return ""; return r.apa + (r.url ? " <a href='" + r.url + "' target='_blank' rel='noopener'>" + esc(r.url) + "</a>" : ""); }
  function ordenRefs(keys) {
    var u = []; keys.forEach(function (k) { if (R[k] && u.indexOf(k) < 0) u.push(k); });
    return u.sort(function (a, b) { return stripTags(R[a].apa).localeCompare(stripTags(R[b].apa), "es"); });
  }
  function stripTags(h) { return String(h).replace(/<[^>]+>/g, ""); }
  function decorar(root) {
    function vecinoCite(n, dir) {
      var x = dir < 0 ? n.previousSibling : n.nextSibling;
      while (x && x.nodeType === 3 && !x.textContent.trim()) x = dir < 0 ? x.previousSibling : x.nextSibling;

  function evaluarRubrica(ev, defensa) {
    var niv = {};

      niv.func = pb === 1 ? 4 : pb >= 0.66 ? 3 : pb >= 0.33 ? 2 : 1;

      var a = ev.analysis;

    // ---- resumen cuantitativo
    var st = C.conceptos.map(function (c) { return S.c[c.id] || cst(c.id); });
    var intentosTot = st.reduce(function (s, x) { return s + x.intentos; }, 0);
    var primeros = st.filter(function (x) { return x.primerIntento === true; }).length;
    var pasos = st.reduce(function (s, x) { return s + x.pasos; }, 0);
    var errS = st.reduce(function (s, x) { return s + x.errSint; }, 0), pyH = st.reduce(function (s, x) { return s + x.pyHints; }, 0);
    var confs = st.filter(function (x) { return x.confianza; }).map(function (x) { return x.confianza; });
    var tsOk = st.filter(function (x) { return x.tsOk; }).length;
    titulo("1. Resumen de desempeño");
    tabla([{ t: "Indicador", w: 110 }, { t: "Valor", w: CW - 110 }], [
      ["Ejercicios aprobados", aprobados() + " de " + C.conceptos.length],
      ["Ejercicios aprobados al primer intento", primeros + ""],
      ["Verificaciones totales de ejercicios", intentosTot + ""],
      ["Ejecuciones paso a paso (ejemplos y ejercicios)", pasos + ""],
      ["Errores de sintaxis en ejercicios", errS + ""],
      ["Errores por usar sintaxis de Python en JavaScript", pyH + ""],
      ["Actividades de TypeScript resueltas correctamente", tsOk + " de " + C.conceptos.length],
      ["Confianza promedio (1 a 5)", confs.length ? (confs.reduce(function (s, x) { return s + x; }, 0) / confs.length).toFixed(1) : "—"],
      ["Tiempo aproximado en los conceptos", mins(tiempoTot)],
      ["Reto final: casos de prueba superados", S.reto.verif ? S.reto.verif.pasados + " de " + S.reto.verif.total : "No verificado"]
    ], { size: 9 });

    // ---- comparativo Python vs JS (para análisis)
    titulo("2. Resumen comparativo Python vs JavaScript", IND);
    parrafo("Opinión del alumno. Sección pensada para tabular las respuestas del grupo.", { italic: true, size: 8.5, color: PIZ });
    var m = S.meta, asp = m.aspectos || {};
    tabla([{ t: "Pregunta", w: 120 }, { t: "Respuesta", w: CW - 120 }], [
      ["Lenguaje con el que fue más fácil entender la lógica", m.logica || "—"],
      ["Dificultad general de Python (1 muy fácil – 5 muy difícil)", String(m.difPy || "—")],
      ["Dificultad general de JavaScript (1 muy fácil – 5 muy difícil)", String(m.difJs || "—")],
      ["Lenguaje preferido para aprender a programar", m.prefiere || "—"],
      ["Influencia de haber aprendido Python primero", m.transfer || "—"],
      ["¿La capa TypeScript ayudó a entender los tipos?", m.ts || "—"],
      ["¿Ayudó la ejecución paso a paso?", m.traza || "—"]
    ].concat(ASPECTOS.map(function (x) { return ["Más fácil: " + x[1], asp[x[0]] || "—"]; })), {
      size: 8.8, colorCol: function (r, i) { if (i !== 1) return null; return r[1] === "Python" ? [55, 118, 171] : r[1] === "JavaScript" ? [176, 120, 10] : null; }
    });

    // ---- progreso por concepto
    titulo("3. Progreso por concepto");
    tabla([{ t: "#", w: 8 }, { t: "Concepto", w: 64 }, { t: "Ejercicio", w: 22 }, { t: "Verif.", w: 14 }, { t: "Paso a paso", w: 20 }, { t: "Pista", w: 13 }, { t: "TS", w: 12 }, { t: "Conf.", w: 12 }, { t: "Tiempo", w: CW - 165 }],
      C.conceptos.map(function (c, i) {
        var x = st[i];
        return [String(i + 1), c.titulo, x.aprobado ? "Aprobado" : "Pendiente", String(x.intentos), String(x.pasos), x.pistaVista ? "Sí" : "No", x.tsOk ? "OK" : "—", x.confianza ? String(x.confianza) : "—", mins(x.tiempo)];
      }), { size: 7.8, colorCol: function (r, i) { return i === 2 ? (r[2] === "Aprobado" ? VER : ROJ) : null; } });

    // ---- reto final
    titulo("4. Reto final: " + C.reto.titulo.replace("Reto final: ", ""), VER);
    var ev = S.reto.codigo ? await evaluar(S.reto.codigo, C.reto.tests, []) : null;
    var rb = evaluarRubrica(ev, S.reto.defensa);
    if (ev && !ev.syntax) tabla([{ t: "Caso de prueba", w: 120 }, { t: "Resultado", w: CW - 120 }], ev.results.map(function (r) { return [r.t.nombre, r.ok ? "Correcto" : "Incorrecto"]; }), { size: 8.8, colorCol: function (r, i) { return i === 1 ? (r[1] === "Correcto" ? VER : ROJ) : null; } });
    else parrafo(ev && ev.syntax ? "El código del reto tiene un error de sintaxis: " + ev.syntax.msg : "Sin código del reto.", { color: ROJ });
    parrafo("Rúbrica — nivel sugerido automáticamente (el profesor asigna la calificación final):", { bold: true, size: 9.5 });
    tabla([{ t: "Criterio", w: 55 }, { t: "Peso", w: 14 }, { t: "Nivel sugerido", w: 34 }, { t: "Descriptor", w: CW - 103 }], RUBRICA.map(function (r) { var n = rb.niveles[r.id]; return [r.nombre, r.peso + "%", NIVELES[n] + " (" + n + ")", r.desc[n]]; }), { size: 8.2 });
    parrafo("Calificación sugerida: " + rb.calif.toFixed(1) + " / 10   ·   Calificación del profesor: ________", { bold: true, size: 11, color: IND });
    parrafo("Defensa de decisiones de diseño:", { bold: true, size: 9.5 });
    parrafo(S.reto.defensa || "(sin respuesta)", { size: 9.5 });
    parrafo("Código del reto:", { bold: true, size: 9.5 });
    codigo(S.reto.codigo);

    // ---- reflexión final
    titulo("5. Reflexión final y metacognición", IND);
    META.forEach(function (q, i) {
      var v = S.meta[q.id], r;
      need(12);
      if (q.tipo === "matriz") { parrafo((i + 1) + ". " + q.txt, { bold: true, size: 9.3, after: 0.6 }); parrafo("Ver la tabla «Más fácil: ...» de la sección 2.", { size: 9.3, indent: 4, italic: true, color: PIZ }); return; }
      if (q.tipo === "checks") r = (v || []).join(", ");
      else r = v == null || v === "" ? "(sin respuesta)" : String(v);
      parrafo((i + 1) + ". " + q.txt, { bold: true, size: 9.3, after: 0.6 });
      parrafo(r, { size: 9.3, indent: 4 });
    });

    // ---- reflexiones por concepto
    titulo("6. Reflexiones por concepto");
    C.conceptos.forEach(function (c, i) {
      var x = st[i];
      need(14);
      parrafo((i + 1) + ". " + c.titulo + " — " + c.reflexion, { bold: true, size: 9, after: 0.6 });
      parrafo(x.reflexion && x.reflexion.trim() ? x.reflexion : "(sin respuesta)", { size: 9, indent: 4, color: x.reflexion && x.reflexion.trim() ? GRA : PIZ });
    });

    // ---- IAG
    titulo("7. Declaración de uso de Inteligencia Artificial Generativa");
    parrafo("Conforme a los Lineamientos para el uso de la IAG en la Universidad de Colima (Acuerdo No. 23 de 2024).", { italic: true, size: 8.5, color: PIZ });
    parrafo(S.iag.uso === "Sí" ? "El alumno declara que SÍ utilizó IA. Herramienta: " + S.iag.herr + ". Uso: " + S.iag.para : "El alumno declara que NO utilizó herramientas de IA generativa para resolver las actividades de este laboratorio.", { size: 10 });
    parrafo("Material del laboratorio elaborado por el profesor con apoyo de IA generativa (Claude, Anthropic), revisado y validado por el profesor.", { italic: true, size: 8.5, color: PIZ });

    // ---- anexo de código
    titulo("Anexo. Código de los ejercicios y actividades");
    C.conceptos.forEach(function (c, i) {
      var x = st[i];
      need(14); parrafo((i + 1) + ". " + c.titulo + " — " + (x.aprobado ? "Aprobado" : "Pendiente"), { bold: true, size: 9.5, color: x.aprobado ? VER : ROJ });
      if (c.actividad) parrafo("Actividad de opción múltiple: " + (x.quizOk != null ? x.quizOk : 0) + " de " + c.actividad.preguntas.length + " respuestas correctas en el último intento.", { size: 9.3, indent: 4 });
      else codigo(x.codigo != null ? x.codigo : "(no modificó el código inicial)");
    });
    pie();
    var nom = (a.matricula || "alumno") + "_" + (a.nombre || "").trim().split(/\s+/)[0];
    doc.save(pdfTxt("Laboratorio_JS_" + nom).replace(/[^\w\-]/g, "") + ".pdf");
  }

  /* ---------------- eventos globales ---------------- */
  document.addEventListener("click", function (e) {
    var gl = e.target.closest("dfn[data-g], [data-gl]"), ci = e.target.closest("cite[data-r]");
    if (gl) { e.preventDefault(); modalGlosario(gl.getAttribute("data-g") || gl.getAttribute("data-gl")); return; }
    if (ci) { e.preventDefault(); modalRef(ci.getAttribute("data-r")); return; }
    if (e.target.closest(".modal-x") || e.target.id === "modal") { cerrarModal(); return; }
    var t = e.target.closest("[data-v]");
    if (t && !t.closest(".lab")) { e.preventDefault(); navegar(t.getAttribute("data-v")); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#modal").classList.contains("hidden")) cerrarModal();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("dfn[data-g], cite[data-r]")) { e.preventDefault(); e.target.click(); }
  });
  $("#menu").addEventListener("click", function () { $(".side").classList.toggle("abierto"); });
  window.addEventListener("beforeunload", function () { cerrarTiempo(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { cerrarTiempo(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
    else if (S.c[vistaActual]) tStart = Date.now();
  });
  window.__LAB_DEBUG = { state: function () { return S; }, evaluar: evaluar, generarPDF: generarPDF };
  render();
})();

}
</script>
